name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm test
      - run: node --check cloudflare/worker.js
      - run: node --check cloudflare/access.js
      - run: node --check src/project-lab.js
      - run: node --check src/project-lab-ui.js
      - run: node --check src/app.js
      - run: node --check src/firmware-ui.js
      - run: node --check src/rom-player.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-private.txt
      - run: python -m unittest discover -s private_server -p 'test_*.py'
      - run: node --check src/audit.js
      - run: node --check src/hardware.js
      - run: node --check src/backup.js
      - run: node --check src/backup-ui.js
